name: react-ui
on:
  push:
    branches: [v2-development, main]
    paths: ['frontend/**', 'app/web/**', 'tests/test_web_api.py', 'requirements-web.txt', '.github/workflows/react-ui.yml']
  pull_request:
    paths: ['frontend/**', 'app/web/**', 'tests/test_web_api.py', 'requirements-web.txt', '.github/workflows/react-ui.yml']
permissions:
  contents: read
jobs:
  build-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-web.txt httpx
      - run: python -m pytest tests/test_web_api.py -q
