name: verified-rag-e2e

on:
  workflow_dispatch:
  push:
    paths:
      - "app/verification/**"
      - "app/rag/**"
      - "app/models/**"
      - "scripts/smoke_verified_rag.py"
      - "tests/test_claim_extractor.py"
      - "tests/test_claim_verifier.py"
      - "tests/test_verified_rag.py"
      - ".github/workflows/verified-rag-e2e.yml"

permissions:
  actions: read
  contents: read

jobs:
  mode-b-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-data.txt -r requirements-retrieval.txt

      - name: Download QASPER raw benchmark
        uses: actions/download-artifact@v4
        with:
          name: research-data-qasper-scifact-hotpot10k
          path: data/external
          github-token: \${{ secrets.GITHUB_TOKEN }}
          run-id: 37356526278

      - name: Download selected BGE validation index
        uses: actions/download-artifact@v4
        with:
          name: qasper-validation-index-bge-small-v1.5
          path: data/indexes/qasper-bge-small
          github-token: \${{ secrets.GITHUB_TOKEN }}
          run-id: 37443041910

      - name: Run real Mode B verification smoke test
        run: |
          python scripts/smoke_verified_rag.py \
            --qasper data/external/qasper/validation.parquet \
            --index data/indexes/qasper-bge-small \
            --output data/evaluation/verified_rag_smoke.json

      - name: Show Mode B result
        run: cat data/evaluation/verified_rag_smoke.json

      - name: Upload Mode B smoke report
        uses: actions/upload-artifact@v4
        with:
          name: verified-rag-mode-b-smoke
          path: data/evaluation/verified_rag_smoke.json
          retention-days: 30
