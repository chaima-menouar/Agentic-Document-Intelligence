name: v2-final-smoke

on:
  push:
    branches: ["v2-development"]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/evaluate_v1_v2.py"
      - "scripts/evaluate_agent_policies.py"
      - "scripts/evaluate_qasper_hybrid.py"
      - "requirements*.txt"
      - ".devcontainer/**"
      - ".github/workflows/v2-final-smoke.yml"
  pull_request:
    branches: ["v2-development"]

jobs:
  full-v2-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install local OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install complete V2 Python stack
        run: python -m pip install -r requirements-all.txt

      - name: Run full regression suite
        run: pytest -q

      - name: Compile V2 entry points
        run: |
          python -m py_compile app/ui/streamlit_app.py
          python -m py_compile scripts/evaluate_v1_v2.py
          python -m py_compile scripts/evaluate_agent_policies.py
          python -m py_compile scripts/evaluate_qasper_hybrid.py

      - name: Validate full V2 imports and local tools
        run: |
          python - <<'PY'
          import pytesseract
          import streamlit
          import faiss
          import sentence_transformers

          from app.agent import (
              AdaptiveAgenticVerifiedRAG,
              AdaptiveRetrievalPolicy,
              AgenticVerifiedRAG,
          )
          from app.rag import (
              ExtractiveGenerator,
              GroundedLocalGenerator,
          )
          from app.retrieval import (
              BM25Index,
              HybridRetriever,
              LocalCrossEncoderReranker,
              SemanticRetriever,
          )
          from app.verification import (
              CitationGroundingVerifier,
              SemanticCitationGroundingVerifier,
          )

          assert pytesseract.get_tesseract_version()
          assert streamlit
          assert faiss
          assert sentence_transformers
          assert AdaptiveAgenticVerifiedRAG
          assert AdaptiveRetrievalPolicy
          assert AgenticVerifiedRAG
          assert ExtractiveGenerator
          assert GroundedLocalGenerator
          assert BM25Index
          assert HybridRetriever
          assert LocalCrossEncoderReranker
          assert SemanticRetriever
          assert CitationGroundingVerifier
          assert SemanticCitationGroundingVerifier

          bm25 = BM25Index([
              "dense semantic retrieval",
              "exact project identifier ORION-7429",
          ])
          assert bm25.scores("ORION-7429")

          print("Full V2 local stack imports and tools validated.")
          print("Tesseract:", pytesseract.get_tesseract_version())
          PY

      - name: Show Streamlit version
        run: python -m streamlit version
