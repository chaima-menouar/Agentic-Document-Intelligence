name: v2-hybrid-retrieval-e2e

on:
  push:
    branches: ["v2-development"]
    paths:
      - "app/retrieval/**"
      - "app/models/**"
      - "app/rag/**"
      - "app/agent/**"
      - "app/ui/**"
      - "scripts/evaluate_qasper_retrieval.py"
      - "scripts/evaluate_qasper_hybrid.py"
      - "tests/test_hybrid_retrieval.py"
      - "tests/test_classical_rag.py"
      - ".github/workflows/v2-hybrid-retrieval-e2e.yml"
  pull_request:
    branches: ["v2-development"]

permissions:
  actions: read
  contents: read

jobs:
  hybrid-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: >
          python -m pip install
          -r requirements.txt
          -r requirements-data.txt
          -r requirements-retrieval.txt
          -r requirements-ui.txt

      - name: Run hybrid retrieval unit tests
        run: >
          pytest -q
          tests/test_hybrid_retrieval.py
          tests/test_classical_rag.py
          tests/test_agentic_rag.py

      - name: Download QASPER validation data
        uses: actions/download-artifact@v4
        with:
          name: research-data-qasper-scifact-hotpot10k
          path: data/external
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37356526278

      - name: Download selected BGE validation index
        uses: actions/download-artifact@v4
        with:
          name: qasper-validation-index-bge-small-v1.5
          path: data/indexes/qasper-bge-small
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37443041910

      - name: Evaluate dense baseline
        run: |
          python scripts/evaluate_qasper_retrieval.py             --qasper data/external/qasper/validation.parquet             --index data/indexes/qasper-bge-small             --output data/evaluation/v2_dense.json             --top-k 1,3,5,10,20             --scope document

      - name: Evaluate hybrid RRF
        run: |
          python scripts/evaluate_qasper_hybrid.py             --qasper data/external/qasper/validation.parquet             --index data/indexes/qasper-bge-small             --output data/evaluation/v2_hybrid_rrf.json             --mode hybrid_rrf             --top-k 1,3,5,10,20

      - name: Compare dense vs hybrid RRF
        run: |
          python scripts/compare_retrievers.py             data/evaluation/v2_dense.json             data/evaluation/v2_hybrid_rrf.json             --output data/evaluation/v2_dense_vs_hybrid.json             --primary-metric recall@5

      - name: Evaluate matched dense 50-question sample
        run: |
          python scripts/evaluate_qasper_retrieval.py             --qasper data/external/qasper/validation.parquet             --index data/indexes/qasper-bge-small             --output data/evaluation/v2_dense_50.json             --top-k 1,3,5             --scope document             --limit 50

      - name: Smoke-test local cross-encoder reranking
        run: |
          python scripts/evaluate_qasper_hybrid.py             --qasper data/external/qasper/validation.parquet             --index data/indexes/qasper-bge-small             --output data/evaluation/v2_hybrid_reranked_50.json             --mode hybrid_reranked             --top-k 1,3,5             --limit 50             --candidate-multiplier 4

      - name: Compare matched dense vs reranked sample
        run: |
          python scripts/compare_retrievers.py             data/evaluation/v2_dense_50.json             data/evaluation/v2_hybrid_reranked_50.json             --output data/evaluation/v2_dense_vs_reranked_50.json             --primary-metric recall@5

      - name: Validate Streamlit module
        run: python -m py_compile app/ui/streamlit_app.py

      - name: Show V2 retrieval results
        run: |
          echo "=== Dense baseline ==="
          cat data/evaluation/v2_dense.json
          echo "=== Hybrid RRF ==="
          cat data/evaluation/v2_hybrid_rrf.json
          echo "=== Dense vs Hybrid ==="
          cat data/evaluation/v2_dense_vs_hybrid.json
          echo "=== Dense 50-question sample ==="
          cat data/evaluation/v2_dense_50.json
          echo "=== Hybrid + reranker sample ==="
          cat data/evaluation/v2_hybrid_reranked_50.json
          echo "=== Dense vs reranked matched sample ==="
          cat data/evaluation/v2_dense_vs_reranked_50.json

      - name: Upload V2 retrieval evaluation
        uses: actions/upload-artifact@v4
        with:
          name: v2-hybrid-retrieval-evaluation
          path: data/evaluation/v2_*.json
          retention-days: 30
