name: v2-local-generator-e2e

on:
  push:
    branches: ["v2-development"]
    paths:
      - "app/rag/**"
      - "app/ui/**"
      - "tests/test_grounded_local_generator.py"
      - ".github/workflows/v2-local-generator-e2e.yml"
  pull_request:
    branches: ["v2-development"]

jobs:
  grounded-local-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt -r requirements-ui.txt
      - name: Run generator unit tests
        run: pytest -q tests/test_grounded_local_generator.py tests/test_extractive_generator.py tests/test_classical_rag.py
      - name: Validate OpenAI-compatible HTTP path with repair
        run: |
          python - <<'PY'
          import json
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          from app.rag import GroundedLocalGenerator

          responses = [
              "BGE embeddings are used for retrieval.",
              "BGE embeddings are used for retrieval [S1].",
          ]
          seen_paths = []
          seen_payloads = []

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  seen_paths.append(self.path)
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length).decode("utf-8"))
                  seen_payloads.append(payload)

                  body = {
                      "choices": [
                          {
                              "message": {
                                  "content": responses.pop(0)
                              }
                          }
                      ]
                  }
                  encoded = json.dumps(body).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              def log_message(self, format, *args):
                  return

          server = HTTPServer(("127.0.0.1", 0), Handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          try:
              prompt = """Answer the question using ONLY the evidence below.

          Question:
          What is used for retrieval?

          Evidence:
          [S1] page=1
          BGE embeddings are used for retrieval.

          Answer:
          """
              generator = GroundedLocalGenerator(
                  model="local-test-model",
                  base_url=f"http://127.0.0.1:{server.server_port}/v1",
                  max_repair_attempts=1,
              )
              answer = generator.generate(prompt)

              assert answer == "BGE embeddings are used for retrieval [S1]."
              assert seen_paths == [
                  "/v1/chat/completions",
                  "/v1/chat/completions",
              ]
              assert len(seen_payloads) == 2
              assert seen_payloads[0]["model"] == "local-test-model"
              assert seen_payloads[0]["temperature"] == 0
              assert "citation contract" in seen_payloads[1]["messages"][1]["content"]
              print(answer)
          finally:
              server.shutdown()
              thread.join(timeout=5)
          PY
      - name: Validate Streamlit module
        run: python -m py_compile app/ui/streamlit_app.py
